    and her team from the Dyer Island Conservation Trust measured her at 4.9 metres, about 16 feet. They put her weight at 1,110 kilograms.
    No larger great white had ever been dissected in South Africa. Boat crews had last logged her alive at Dyer Island almost a year
    earlier.
