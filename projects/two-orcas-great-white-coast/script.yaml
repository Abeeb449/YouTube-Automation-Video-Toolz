    great white about 2.5 metres long. He grabbed it by the side fin. Within two minutes he had torn it open and taken the liver. Port
    stayed about a hundred metres away the whole time. A second dead great white, 3.5 metres long, was found nearby that day. Great
    whites then kept away from that part of the bay for about four months.
