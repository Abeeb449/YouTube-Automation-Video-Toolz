# The Two Orcas That Emptied a Great White Shark Coast — first video for the channel.
# Written by direct.py from script.txt (the narration is the script, sentence for sentence). Change the shots in
# direct.py and run it again; this file is what gets rendered.
preset: ocean
title: The Two Orcas That Emptied a Great White Shark Coast
description: 'In May 2017 a great white shark almost five metres long washed up on a South African beach with its liver missing. This
  is the story of Port and Starboard, the two orcas that learned to hunt great whites, the bay they emptied, and the argument among
  scientists over how much of the blame is theirs.


  The animals and events in this video are shown as 3D reconstructions, except where real photos or footage are credited below.'
