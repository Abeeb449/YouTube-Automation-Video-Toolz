# TEST PROJECT for the render workflow (not a video for the channel).
# Five live 3D shots with a light test voice; the narration is recorded in narration/ so every machine uses the same recording.
preset: ocean
title: Render test (live 3D)
description: 'A short test of the live 3D shots: a shark under water, a beach, a map, a view from the air and a look inside a shark. Rendered
  on one machine and split over several, to show both give the same video. Not for publishing.'
tags:
- test
sources:
- Test narration only; not a published claim
settings:
  intro: 4
  voice:
    engine: kokoro
  music:
    source: incompetech
    mood: mystery
youtube:
  privacy: private
scenes:
- chapter: Test
  mood: mystery
  text: A great white shark can grow to more than five metres long.
  visual:
    remotion: Shot3D
    props:
      env:
        kind: sea
        depth: 0.3
      cast:
      - id: s
        model: greatWhite
        length: 4.9
        path:
        - u: 0
          p:
          - -12
          - -5.5
          - -3
        - u: 0.5
          p:
          - -1
          - -5
          - 1.2
        - u: 1
          p:
          - 10
          - -4.6
          - -2
      camera:
      - u: 0
        pos:
        - 3.5
        - -5.2
        - 12.5
        look: s
      - u: 1
        pos:
        - -1.5
        - -4.4
        - 8.5
        look: s
      gfx:
      - type: tag
        at: white
        anchor:
          actor: s
          point: dorsal
        text: Great white shark
        dir: ne
      - type: line
        at: five
        text: More than five metres long
        hi: five metres
