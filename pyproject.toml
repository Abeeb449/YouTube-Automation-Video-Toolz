[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytauto"
version = "1.0.0"
description = "Script-to-YouTube-video automation: TTS voiceover, captions, stock footage, Remotion & Blender visuals, ffmpeg assembly."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "edge-tts>=7.0", "numpy>=1.24"]

[project.optional-dependencies]
piper = ["piper-tts>=1.3"]
youtube = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]

[project.scripts]
ytauto = "ytauto.cli:main"

[tool.setuptools]
packages = ["ytauto"]
