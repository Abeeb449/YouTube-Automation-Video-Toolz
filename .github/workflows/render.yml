name: Render video

# Run manually from the Actions tab ("Run workflow"), or automatically when a
# projects/<name>/script.yaml is pushed.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder to render"
        default: projects/example
        required: true
      style:
        description: "If the folder only has script.txt: auto = picked from the topic, nature = any animal (real photos/video + 3D), ocean = drawn deep sea, documentary = history/science/what-if"
        type: choice
        options: [auto, nature, ocean, documentary]
        default: auto
      format:
        description: "If the folder only has script.txt: video = 16:9 1080p, shorts = vertical 1080x1920 Short with captions"
        type: choice
        options: [video, shorts]
        default: video
      voice:
        description: "Narrator: project = as set in script.yaml, ryan = Qwen Ryan, natural read"
        type: choice
        options: [project, ryan]
        default: project
      replan:
        description: "Re-plan scenes from script.txt even if script.yaml exists"
        type: boolean
        default: false
      collect_only:
        description: "Only find and check the b-roll and 3D models (up to 50 minutes, no video): gives you the review sheet first"
        type: boolean
        default: false
      parallel:
        description: "Parallel rendering: split the scenes over this many machines, then check and join them (off = one machine, as always)"
        type: choice
        options: ["off", "2", "3", "4", "6"]
        default: "off"
      preview:
        description: "Fast 480p preview instead of full quality"
        type: boolean
        default: false
      release:
        description: "ALSO publish as a GitHub Release (PUBLIC download if the repo is public)"
        type: boolean
        default: false
      upload_youtube:
        description: "Upload to YouTube (needs YT_* secrets)"
        type: boolean
        default: false
      privacy:
        description: "YouTube privacy"
        type: choice
        options: [private, unlisted, public]
        default: private
      tidy:
        description: "ONLY tidy up, no render: delete old caches and old artifacts (the newest of each is kept)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["projects/**/script.yaml", "projects/**/script.txt"]

permissions:
  contents: write
  actions: write      # to delete this project's older caches after a new one is saved

env:
  # the image build step otherwise leaves a ".dockerbuild" artifact (kept 90 days) on every job
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

concurrency:
  group: render-${{ github.ref }}-${{ inputs.project || 'push' }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ !inputs.tidy }}
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.pick.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="[\"${{ inputs.project }}\"]"
          else
            list=$(git diff --name-only HEAD~1 HEAD -- 'projects/**/script.yaml' 'projects/**/script.txt' \
                   | xargs -r -n1 dirname | sort -u | jq -R . | jq -sc .)
          fi
          echo "projects=${list:-[]}" >> "$GITHUB_OUTPUT"
          echo "Projects to render: ${list:-[]}"

  # The whole video on one machine. This is the standard way and stays as it is; it also does the b-roll
  # collection. It is skipped only when "parallel" is switched on for a render.
  render:
    needs: plan
    if: needs.plan.outputs.projects != '[]' && ((inputs.parallel || 'off') == 'off' || inputs.collect_only)
    runs-on: ubuntu-latest
    timeout-minutes: 358   # GitHub's hosted-runner maximum is 360
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.plan.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build render image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ytauto:latest
          cache-from: type=gha,scope=ytauto
          cache-to: type=gha,scope=ytauto,mode=max

      # Restore and save are separate steps so the work is kept even when a render stops early (time limit,
      # error): the next run then continues from the narration, photos and scenes already finished.
      - name: Restore render cache (voiceover, stock, rendered clips)
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.project }}/.cache
          key: ytauto-${{ matrix.project }}--run-${{ github.run_id }}
          restore-keys: ytauto-${{ matrix.project }}--run-

      - name: Restore voice models (Qwen3-TTS / Chatterbox / Whisper / CLIP)
        id: hfcache
        uses: actions/cache/restore@v4
        with:
          path: .cache/huggingface
          key: hf-models-v3-none          # never matches: the newest "hf-models-v3-<contents>" is restored below
          restore-keys: |
            hf-models-v3-
            hf-models-v2-

      - name: Render
        timeout-minutes: 335
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YTAUTO_VOICE: ${{ inputs.voice || 'project' }}
          YTAUTO_CONTACT: ${{ secrets.YTAUTO_CONTACT || vars.YTAUTO_CONTACT }}   # as a secret it is hidden in the public run logs
          YTAUTO_STOCK_LICENSES: ${{ vars.YTAUTO_STOCK_LICENSES }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}   # optional: free Sketchfab account token → many more 3D models
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          mkdir -p "${{ matrix.project }}/.cache" .cache/huggingface
          # what this run has to work with (a voice engine that crashes is usually short of memory)
          echo "runner: $(nproc) CPUs"; free -h | sed -n 1,3p; df -h / | tail -1
          docker run --rm ytauto:latest bash -c '/opt/tts-qwen/bin/pip list 2>/dev/null | grep -iE "^(torch|torchaudio|qwen-tts|transformers|accelerate|numpy) "' || true
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HF_HOME=/work/.cache/huggingface \
            -e UNSPLASH_ACCESS_KEY -e YTAUTO_VOICE -e YTAUTO_CONTACT -e YTAUTO_STOCK_LICENSES -e PEXELS_API_KEY -e PIXABAY_API_KEY -e SKETCHFAB_TOKEN -e ELEVENLABS_API_KEY \
            ytauto:latest bash -c '
              set -e
              P="${{ matrix.project }}"
              # Plain script only? Plan the scenes first with the free built-in director.
              if [ -f "$P/script.txt" ] && { [ ! -f "$P/script.yaml" ] || [ "${{ inputs.replan }}" = "true" ]; }; then
                python -m ytauto plan "$P/script.txt" --out "$P" --style "${{ inputs.style || 'auto' }}" --format "${{ inputs.format || 'video' }}"
              fi
              # Pre-render review (originality, sources, variety); printed in the log, never blocks the render
              python -m ytauto check "$P" > "$P/check.txt" 2>&1 || echo "::warning::ytauto check found issues to fix in $P (see build/check.txt)"
              cat "$P/check.txt"
              if [ "${{ inputs.collect_only }}" = "true" ]; then
                # only the collection step: every 3D model, photo and clip is found, checked and listed for review
                python -m ytauto broll "$P" --minutes 50
              else
                # stop cleanly before the job limit so the finished parts are saved to the cache below; a render that
                # does not finish in one run is finished by running the workflow a second time
                timeout -s INT 325m python -m ytauto render "$P" ${{ inputs.preview && '--preview' || '' }}
              fi
              mkdir -p "$P/build"
              mv "$P/check.txt" "$P/build/check.txt" 2>/dev/null || true
              cp "$P/script.yaml" "$P/build/script.yaml"   # the plan travels with the video, so you can tweak and re-render
            '

          rm -rf "${{ matrix.project }}/.cache/work"
          ls -la "${{ matrix.project }}/build"

      - name: Save render cache (also when the render stopped early)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ matrix.project }}/.cache
            !${{ matrix.project }}/.cache/work
          key: ytauto-${{ matrix.project }}--run-${{ github.run_id }}

      - name: Name the model cache by its contents
        id: hfname
        if: always()
        run: |
          mkdir -p .cache/huggingface
          echo "key=hf-models-v3-$(find .cache/huggingface -type f -printf '%P %s\n' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save voice models (only when something was added)
        if: always() && steps.hfname.outputs.key != steps.hfcache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: .cache/huggingface
          key: ${{ steps.hfname.outputs.key }}

      # Every run saves a new cache, and GitHub keeps them all until its 10 GB are full. Only the newest of this
      # project (and of the models) is ever restored, so the older ones go as soon as the new one is in.
      - name: Remove older caches of this project
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in "ytauto-${{ matrix.project }}--run-" "hf-models-v"; do
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" --sort created_at --order desc --limit 100 --json id,key \
              | jq -r '.[1:][] | "\(.id) \(.key)"' | while read -r id key; do
                  gh cache delete "$id" --repo "$GITHUB_REPOSITORY" && echo "removed older cache: $key"
                done || true
          done

      - name: Name outputs
        id: meta
        if: always()
        shell: bash
        run: |
          name=$(basename "${{ matrix.project }}")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=video-$name-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          {
            echo "### 🎬 ${name}"
            if [ -f "${{ matrix.project }}/build/manifest.json" ]; then
              echo '```json'
              cat "${{ matrix.project }}/build/manifest.json"
              echo '```'
            else
              echo '```'
              cat "${{ matrix.project }}/build/broll_report.txt" 2>/dev/null || echo "No video in this run."
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: always()      # a run that was stopped still hands over what it finished (the review sheet, the report)
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: ${{ steps.meta.outputs.name }}-${{ inputs.collect_only && 'review' || 'video' }}
          path: ${{ matrix.project }}/build/
          retention-days: 4
          compression-level: 0

      - name: Publish GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "🎬 ${{ steps.meta.outputs.name }} #${{ github.run_number }}"
          body_path: ${{ matrix.project }}/build/description.txt
          files: |
            ${{ matrix.project }}/build/*.mp4
            ${{ matrix.project }}/build/thumbnail.jpg
            ${{ matrix.project }}/build/captions.srt
            ${{ matrix.project }}/build/manifest.json

      - name: Upload to YouTube
        if: inputs.upload_youtube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e YT_CLIENT_ID -e YT_CLIENT_SECRET -e YT_REFRESH_TOKEN \
            ytauto:latest python -m ytauto upload "${{ matrix.project }}" --privacy "${{ inputs.privacy }}"

  # -----------------------------------------------------------------------------------------------------------
  # TIDY UP (tick "tidy"): no render. Deletes what is never used again and only takes room:
  #   caches     the newest of each kind stays (per project; the models); older ones and caches saved under the
  #              old naming go
  #   artifacts  expired ones, hand-overs between parallel machines, image build records, test videos; of
  #              everything else the newest with each name stays, so a finished video is never removed
  # -----------------------------------------------------------------------------------------------------------
  tidy:
    name: "Tidy up: old caches and artifacts"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tidy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete old caches and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          R="$GITHUB_REPOSITORY"
          gh api "repos/$R/actions/caches?per_page=100" --paginate --jq '.actions_caches[] | [.id, .key, .created_at, .size_in_bytes] | @tsv' > caches.tsv || true
          gh api "repos/$R/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | [.id, .name, .created_at, .expired, .size_in_bytes] | @tsv' > artifacts.tsv || true
          python3 - <<'PY'
          import csv, re
          def rows(f):
              try:
                  return [r for r in csv.reader(open(f), delimiter="\t") if r]
              except FileNotFoundError:
                  return []
          keep, drop = [], []
          fam = {}
          for cid, key, made, size in rows("caches.tsv"):
              m = re.match(r"^(ytauto-.+)--run-\d+$", key)
              if m:
                  f = ("new", m.group(1))
              elif re.match(r"^ytauto-.+-\d+$", key):
                  f = ("old", "")                       # the old naming: never restored again
              elif key.startswith("hf-models-"):
                  f = ("models", "")
              else:
                  f = None                               # the image build cache and anything else: left alone
              if f is None:
                  keep.append(("cache", key, size)); continue
              fam.setdefault(f, []).append((made, cid, key, size))
          for f, items in fam.items():
              items.sort(reverse=True)
              if f[0] == "old":
                  drop += [("cache", c, k, s) for _m, c, k, s in items]
              else:
                  keep.append(("cache", items[0][2], items[0][3]))
                  drop += [("cache", c, k, s) for _m, c, k, s in items[1:]]
          names = {}
          for aid, name, made, expired, size in rows("artifacts.tsv"):
              if expired == "true" or name.startswith("par-") or name.endswith(".dockerbuild") or name.startswith("parallel-test"):
                  drop.append(("artifact", aid, name, size)); continue
              names.setdefault(name, []).append((made, aid, name, size))
          for name, items in names.items():
              items.sort(reverse=True)
              keep.append(("artifact", items[0][2], items[0][3]))
              drop += [("artifact", a, n, s) for _m, a, n, s in items[1:]]
          with open("drop.tsv", "w") as f:
              for kind, i, name, size in drop:
                  f.write(f"{kind}\t{i}\t{name}\t{size}\n")
          with open("keep.txt", "w") as f:
              for kind, name, size in keep:
                  f.write(f"- kept {kind}: {name} ({int(size) / 1e6:.0f} MB)\n")
          PY
          freed=0
          {
            echo "### Tidy up"
            while IFS=$'\t' read -r kind id name size; do
              if [ "$kind" = "cache" ]; then path="repos/$R/actions/caches/$id"; else path="repos/$R/actions/artifacts/$id"; fi
              if gh api -X DELETE "$path" >/dev/null 2>&1; then
                echo "- deleted $kind: $name ($((size / 1000000)) MB)"; freed=$((freed + size))
              else
                echo "- could NOT delete $kind: $name"
              fi
            done < drop.tsv
            echo ""
            echo "**Freed about $((freed / 1000000)) MB.**"
            echo ""
            cat keep.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------------------------------------------
  # PARALLEL RENDERING (optional: choose a number in the "parallel" box).
  # The video is the same as from the single job above: same plan (script.yaml), same recorded narration, same
  # approved b-roll, same music, captions and description. Only which machine renders which scene changes.
  #   1. prepare   collects the b-roll, the narration and the 3D pictures once, for all machines
  #   2. share     several machines side by side, each rendering its share of the scenes
  #   3. build     takes every clip, checks that all are there, the right length and in script order, and builds
  #                the video. If a clip is missing it stops and lists the scenes: no gaps, no stand-ins.
  # -----------------------------------------------------------------------------------------------------------
  par-prepare:
    name: "Parallel 1/3: prepare"
    needs: plan
    if: github.event_name == 'workflow_dispatch' && (inputs.parallel || 'off') != 'off' && !inputs.collect_only
    runs-on: ubuntu-latest
    timeout-minutes: 358
    outputs:
      shards: ${{ steps.split.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build render image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ytauto:latest
          cache-from: type=gha,scope=ytauto
          cache-to: type=gha,scope=ytauto,mode=max

      - id: split
        run: echo "shards=$(seq 1 ${{ inputs.parallel }} | jq -sc .)" >> "$GITHUB_OUTPUT"

      - name: Restore render cache (voiceover, stock)
        uses: actions/cache/restore@v4
        with:
          path: ${{ inputs.project }}/.cache
          key: ytauto-${{ inputs.project }}--run-${{ github.run_id }}
          restore-keys: ytauto-${{ inputs.project }}--run-

      - name: Restore voice models (Qwen3-TTS / Chatterbox / Whisper / CLIP)
        id: hfcache
        uses: actions/cache/restore@v4
        with:
          path: .cache/huggingface
          key: hf-models-v3-none          # never matches: the newest "hf-models-v3-<contents>" is restored below
          restore-keys: |
            hf-models-v3-
            hf-models-v2-

      - name: Prepare (plan, b-roll, narration, 3D pictures)
        timeout-minutes: 335
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YTAUTO_VOICE: ${{ inputs.voice || 'project' }}
          YTAUTO_CONTACT: ${{ secrets.YTAUTO_CONTACT || vars.YTAUTO_CONTACT }}   # as a secret it is hidden in the public run logs
          YTAUTO_STOCK_LICENSES: ${{ vars.YTAUTO_STOCK_LICENSES }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          mkdir -p "${{ inputs.project }}/.cache" .cache/huggingface
          echo "runner: $(nproc) CPUs"; free -h | sed -n 1,3p; df -h / | tail -1
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HF_HOME=/work/.cache/huggingface \
            -e UNSPLASH_ACCESS_KEY -e YTAUTO_VOICE -e YTAUTO_CONTACT -e YTAUTO_STOCK_LICENSES -e PEXELS_API_KEY -e PIXABAY_API_KEY -e SKETCHFAB_TOKEN -e ELEVENLABS_API_KEY \
            ytauto:latest bash -c '
              set -e
              P="${{ inputs.project }}"
              if [ -f "$P/script.txt" ] && { [ ! -f "$P/script.yaml" ] || [ "${{ inputs.replan }}" = "true" ]; }; then
                python -m ytauto plan "$P/script.txt" --out "$P" --style "${{ inputs.style || 'auto' }}" --format "${{ inputs.format || 'video' }}"
              fi
              python -m ytauto check "$P" > "$P/check.txt" 2>&1 || echo "::warning::ytauto check found issues to fix in $P (see build/check.txt)"
              cat "$P/check.txt"
              timeout -s INT 325m python -m ytauto render "$P" --prepare ${{ inputs.preview && '--preview' || '' }}
              mkdir -p "$P/build"
              mv "$P/check.txt" "$P/build/check.txt" 2>/dev/null || true
              cp "$P/script.yaml" "$P/build/script.yaml"
            '
          rm -rf "${{ inputs.project }}/.cache/work" "${{ inputs.project }}/.cache/shards"

      - name: Save render cache (voiceover, stock)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ inputs.project }}/.cache
            !${{ inputs.project }}/.cache/work
          key: ytauto-${{ inputs.project }}--run-${{ github.run_id }}

      - name: Name the model cache by its contents
        id: hfname
        if: always()
        run: |
          mkdir -p .cache/huggingface
          echo "key=hf-models-v3-$(find .cache/huggingface -type f -printf '%P %s\n' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save voice models (only when something was added)
        if: always() && steps.hfname.outputs.key != steps.hfcache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: .cache/huggingface
          key: ${{ steps.hfname.outputs.key }}

      # Every run saves a new cache, and GitHub keeps them all until its 10 GB are full. Only the newest of this
      # project (and of the models) is ever restored, so the older ones go as soon as the new one is in.
      - name: Remove older caches of this project
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in "ytauto-${{ inputs.project }}--run-" "hf-models-v"; do
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" --sort created_at --order desc --limit 100 --json id,key \
              | jq -r '.[1:][] | "\(.id) \(.key)"' | while read -r id key; do
                  gh cache delete "$id" --repo "$GITHUB_REPOSITORY" && echo "removed older cache: $key"
                done || true
          done

      # Everything the other machines need, so that all of them work from the very same files. Clips rendered
      # in earlier runs are left out: each machine renders its own share.
      - name: Hand the prepared material to the render machines
        uses: actions/upload-artifact@v4
        with:
          name: par-prepared
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ inputs.project }}/.cache
            !${{ inputs.project }}/.cache/work
            !${{ inputs.project }}/.cache/work/**
            !${{ inputs.project }}/.cache/clips
            !${{ inputs.project }}/.cache/clips/**
            ${{ inputs.project }}/script.yaml
            ${{ inputs.project }}/build
          retention-days: 4
          compression-level: 0

  par-shard:
    name: "Parallel 2/3: render share ${{ matrix.shard }} of ${{ inputs.parallel }}"
    needs: par-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false      # one machine failing never stops the others; the build step then names what is missing
      matrix:
        shard: ${{ fromJson(needs.par-prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build render image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ytauto:latest
          cache-from: type=gha,scope=ytauto

      - name: Take the prepared material
        uses: actions/download-artifact@v4
        with:
          name: par-prepared
          path: ${{ inputs.project }}

      - name: Render this machine's share of the scenes
        timeout-minutes: 345
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YTAUTO_VOICE: ${{ inputs.voice || 'project' }}
          YTAUTO_CONTACT: ${{ secrets.YTAUTO_CONTACT || vars.YTAUTO_CONTACT }}   # as a secret it is hidden in the public run logs
          YTAUTO_STOCK_LICENSES: ${{ vars.YTAUTO_STOCK_LICENSES }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          mkdir -p .cache/huggingface
          echo "runner: $(nproc) CPUs"; free -h | sed -n 1,3p; df -h / | tail -1
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HF_HOME=/work/.cache/huggingface \
            -e UNSPLASH_ACCESS_KEY -e YTAUTO_VOICE -e YTAUTO_CONTACT -e YTAUTO_STOCK_LICENSES -e PEXELS_API_KEY -e PIXABAY_API_KEY -e SKETCHFAB_TOKEN -e ELEVENLABS_API_KEY \
            ytauto:latest bash -c '
              set -e
              timeout -s INT 335m python -m ytauto render "${{ inputs.project }}" --shard ${{ matrix.shard }}/${{ inputs.parallel }} ${{ inputs.preview && '--preview' || '' }}
            '

      - name: Hand over the finished clips
        uses: actions/upload-artifact@v4
        with:
          name: par-clips-${{ matrix.shard }}
          overwrite: true      # a machine that is run again replaces its earlier hand-over
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ inputs.project }}/.cache/shards
          retention-days: 4
          compression-level: 0

  par-assemble:
    name: "Parallel 3/3: check every clip and build the video"
    needs: [par-prepare, par-shard]
    # runs even when a render machine failed, so that the missing scenes are named (and no video is built)
    if: ${{ !cancelled() && needs.par-prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build render image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ytauto:latest
          cache-from: type=gha,scope=ytauto

      - name: Take the prepared material
        uses: actions/download-artifact@v4
        with:
          name: par-prepared
          path: ${{ inputs.project }}

      - name: Take the clips of every render machine
        uses: actions/download-artifact@v4
        with:
          pattern: par-clips-*
          merge-multiple: true
          path: ${{ inputs.project }}/.cache/shards

      - name: Check every clip and build the video
        timeout-minutes: 335
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YTAUTO_VOICE: ${{ inputs.voice || 'project' }}
          YTAUTO_CONTACT: ${{ secrets.YTAUTO_CONTACT || vars.YTAUTO_CONTACT }}   # as a secret it is hidden in the public run logs
          YTAUTO_STOCK_LICENSES: ${{ vars.YTAUTO_STOCK_LICENSES }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          mkdir -p .cache/huggingface
          echo "runner: $(nproc) CPUs"; free -h | sed -n 1,3p; df -h / | tail -1
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HF_HOME=/work/.cache/huggingface \
            -e UNSPLASH_ACCESS_KEY -e YTAUTO_VOICE -e YTAUTO_CONTACT -e YTAUTO_STOCK_LICENSES -e PEXELS_API_KEY -e PIXABAY_API_KEY -e SKETCHFAB_TOKEN -e ELEVENLABS_API_KEY \
            ytauto:latest bash -c '
              set -e
              P="${{ inputs.project }}"
              python -m ytauto render "$P" --assemble ${{ inputs.preview && '--preview' || '' }}
              cp "$P/script.yaml" "$P/build/script.yaml"
            '
          rm -rf "${{ inputs.project }}/.cache/work"
          ls -la "${{ inputs.project }}/build"

      - name: Name outputs
        id: meta
        if: always()
        shell: bash
        run: |
          name=$(basename "${{ inputs.project }}")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=video-$name-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          {
            echo "### 🎬 ${name} (parallel render, ${{ inputs.parallel }} machines)"
            echo '```'
            cat "${{ inputs.project }}/build/parallel_report.txt" 2>/dev/null || echo "The check of the clips did not run."
            echo '```'
            if [ -f "${{ inputs.project }}/build/manifest.json" ]; then
              echo '```json'
              cat "${{ inputs.project }}/build/manifest.json"
              echo '```'
            else
              echo "**No video was built in this run.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: ${{ steps.meta.outputs.name }}-video
          path: ${{ inputs.project }}/build/
          retention-days: 4
          compression-level: 0

      - name: Publish GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "🎬 ${{ steps.meta.outputs.name }} #${{ github.run_number }}"
          body_path: ${{ inputs.project }}/build/description.txt
          files: |
            ${{ inputs.project }}/build/*.mp4
            ${{ inputs.project }}/build/thumbnail.jpg
            ${{ inputs.project }}/build/captions.srt
            ${{ inputs.project }}/build/manifest.json

      - name: Upload to YouTube
        if: inputs.upload_youtube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e YT_CLIENT_ID -e YT_CLIENT_SECRET -e YT_REFRESH_TOKEN \
            ytauto:latest python -m ytauto upload "${{ inputs.project }}" --privacy "${{ inputs.privacy }}"
